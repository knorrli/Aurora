<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurora Patch Editor</title>
<style>
  :root {
    --bg: #14151a; --panel: #1c1e26; --sunk: #101118; --line: #2c2f3a; --rail: #3a3e4d;
    --text: #e6e7ec; --dim: #8b8fa3; --faint: #5f6475;
    --select: #d4d7e0; --warn: #d9b03f; --ok: #4a9e6a; --bad: #cf5c5c;
    --shape: #e6c454; --travel: #e08a3c; --fan: #e0544a; --color: #6fa8dc; --lfo: #d466d6; --scatter: #7bc4a4;
    --out: #8f7fd4;
    --topbar: 56px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  }
  h1 { font-size: 13px; margin: 0; letter-spacing: .16em; text-transform: uppercase; color: var(--text); }
  h2 {
    font-size: 11px; margin: 0 0 9px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim);
  }
  h3 {
    font-size: 11px; margin: 0 0 8px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--dim); border-bottom: 1px solid var(--line); padding-bottom: 5px;
    display: flex; align-items: baseline; gap: 8px;
  }
  h4 {
    font-size: 10px; margin: 0 0 7px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--faint);
  }
  p { margin: 0; }
  .note { color: var(--dim); font-size: 11.5px; line-height: 1.5; margin-top: 9px; }
  .cc { color: var(--faint); font-size: 10.5px; letter-spacing: .04em; }
  body:not(.show-midi) .cc.midi-number { display: none; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }

  button, select, input[type=text], input[type=number] {
    background: #262933; color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 9px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--select); color: var(--select); }
  button:disabled { opacity: .35; cursor: default; }
  button.on, button.on:hover:not(:disabled) { border-color: var(--select); color: var(--bg); background: var(--select); }
  .tiny { padding: 2px 7px; font-size: 10.5px; letter-spacing: .06em; }

  .top {
    position: sticky; top: 0; z-index: 30; display: flex; gap: 14px; align-items: center;
    flex-wrap: wrap; padding: 10px 16px; background: #171921;
    border-bottom: 1px solid var(--line);
  }
  .top #status {
    flex: 1 1 0; min-width: 0; font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .top .group { display: flex; gap: 7px; align-items: center; }
  .top .group + .group { border-left: 1px solid var(--line); padding-left: 14px; }
  .beats { display: flex; gap: 5px; align-items: center; margin-left: 4px; }
  .beats i { width: 9px; height: 9px; border-radius: 50%; background: var(--rail); }
  .beats i:first-child { width: 11px; height: 11px; }
  .beats i.on { background: #555966; }
  .beats i.hit { background: var(--select); box-shadow: 0 0 8px var(--select); }

  .shell {
    display: grid;
    grid-template-columns: minmax(232px, 300px) minmax(0, 1fr) minmax(268px, 348px);
    gap: 16px; padding: 16px; align-items: start;
  }

  .rail, .dock { position: sticky; top: calc(var(--topbar) + 10px); }
  .rail { max-height: calc(100vh - var(--topbar) - 20px); overflow-y: auto; scrollbar-gutter: stable; }
  .rail .panel { padding: 11px 13px; }
  .rail .panel + .panel { margin-top: 10px; }
  .rail .row { grid-template-columns: 72px minmax(48px, 1fr) auto; gap: 6px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 13px; }
  .panel + .panel { margin-top: 14px; }
  .view > * + * { margin-top: 16px; }

.library-head { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .library-head h2 { margin: 0; }
  .library-head + .library-head { margin-top: -2px; }
  .patch-grid { display: grid; grid-template-columns: auto repeat(9, minmax(0, 1fr)); gap: 4px; align-items: center; }
  .patch-grid .row-label { color: var(--faint); font-size: 10.5px; text-align: center; padding: 0 4px; }
  .patch-grid .cell {
    position: relative; min-width: 0; height: 34px; padding: 5px 6px 2px; border-radius: 3px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: stretch;
    background: var(--sunk); border: 1px solid var(--line); color: var(--text); text-align: left;
    font-size: 11px; line-height: 1.25; overflow: hidden;
  }
  .patch-grid .cell.empty { background: none; color: var(--faint); }
  .patch-grid .cell .color { position: absolute; left: 0; right: 0; top: 0; height: 4px; }
  .patch-grid .cell .cell-head { display: flex; justify-content: space-between; gap: 2px; }
  .patch-grid .cell .slot { color: var(--faint); }
  .patch-grid .cell .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .patch-grid .cell.on, .patch-grid .cell.on:hover:not(:disabled) {
    background: #2b2d36; border-color: var(--select); color: var(--text);
  }
  .patch-grid .cell.target { border-style: dashed; border-color: var(--select); }
  .patch-grid .cell.dirty .name::after { content: ' \2022'; color: var(--select); }
  .patch-grid .cell.dragging { opacity: .4; }
  .patch-grid .cell.drop { border-color: var(--text); }
  .grip { color: var(--faint); cursor: grab; margin-right: 6px; user-select: none; }
  .grip:hover, .picked > .grip { color: var(--text); }
  body.above-base .grip { display: none; }
  .movable.picked { outline: 1px dashed var(--text); outline-offset: 3px; }
  body.carrying .layers .tab.takes-drop { border-style: dashed; border-color: var(--dim); }
  .layers .tab.drop { border-color: var(--text); color: var(--text); }

  .stack { display: flex; flex-direction: column; gap: 7px; }
  .rowline { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }

  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .fields input[type=text] { width: 100%; }

  .layers { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
  .layers .tab {
    display: flex; gap: 10px; justify-content: space-between; align-items: baseline;
    padding: 2px 9px; min-width: 0;
  }
  .layers .tab .badge { font-size: 10px; color: var(--faint); letter-spacing: .04em; }
  .layers .tab.on .badge { color: var(--bg); }
  .layers .tab.unsaved > :first-child::after, #subjectKind.unsaved::after { content: ' \2022'; color: var(--select); }
  .layers .tab.on.unsaved > :first-child::after { color: var(--bg); }

  .transition .scrub { display: flex; gap: 9px; align-items: center; }
  .transition .scrub input[type=range] { flex: 1 1 60px; min-width: 60px; }
  .fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; }
  .fields .field { display: contents; }
  .fields .field.inert > * { opacity: .38; }
  .fields select { width: 100%; }
  .transition .fields { margin-top: 9px; }

  #mixBar[hidden] { display: none; }
  #mixBar .mix-rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 2px 22px; }
  .rail h2, .dock h2 { display: flex; align-items: baseline; gap: 6px; }
  .rail h2 > .tiny:first-of-type { margin-left: auto; }
  .overlay-buttons { display: grid; gap: 3px; margin-top: 9px; }
  .overlay-buttons > div { display: flex; gap: 3px; }
  .overlay-buttons .tiny { padding: 2px 5px; }
  .overlay-buttons button:not(.on)[data-tone=shape] { color: var(--shape); }
  .overlay-buttons button:not(.on)[data-tone=travel] { color: var(--travel); }
  .overlay-buttons button:not(.on)[data-tone=fan] { color: var(--fan); }
  .overlay-buttons button:not(.on)[data-tone=lfo] { color: var(--lfo); }
  .overlay-buttons button:not(.on)[data-tone=scatter] { color: var(--scatter); }
  .overlay-buttons button:not(.on)[data-tone=color] { color: var(--color); }
  .overlay-buttons button:not(.on)[data-tone=out] { color: var(--out); }
  .overlay-buttons button.on[data-tone=shape] { background: var(--shape); border-color: var(--shape); }
  .overlay-buttons button.on[data-tone=travel] { background: var(--travel); border-color: var(--travel); }
  .overlay-buttons button.on[data-tone=fan] { background: var(--fan); border-color: var(--fan); }
  .overlay-buttons button.on[data-tone=lfo] { background: var(--lfo); border-color: var(--lfo); }
  .overlay-buttons button.on[data-tone=scatter] { background: var(--scatter); border-color: var(--scatter); }
  .overlay-buttons button.on[data-tone=color] { background: var(--color); border-color: var(--color); }
  .overlay-buttons button.on[data-tone=out] { background: var(--out); border-color: var(--out); }

  .shape { border-left: 3px solid var(--shape); }
  .shape .groups { row-gap: 0; }
  .shape .groups > div { margin-left: -16px; padding: 0 0 16px 13px; border-left: 3px solid var(--shape); }
  .shape .groups > div:last-child { margin-bottom: -13px; padding-bottom: 13px; }
  .shape .tone-form h3 { color: var(--shape); }
  .shape .groups > .tone-travel { border-left-color: var(--travel); }
  .shape .tone-travel h3 { color: var(--travel); }
  .shape .groups > .tone-fan { border-left-color: var(--fan); }
  .shape .tone-fan h3 { color: var(--fan); }
  .shape-name { font-size: 12px; letter-spacing: .18em; color: var(--shape); margin-bottom: 12px; }
  .push-right { margin-left: auto; }

  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 16px 22px; }

  .row {
    display: grid; grid-template-columns: 108px minmax(64px, 1fr) 106px 24px;
    gap: 8px; align-items: center; padding: 1px 0 1px 7px;
    border-left: 2px solid transparent; margin-left: -9px;
  }
  .row + .row { margin-top: 3px; }
  .row > label { line-height: 1.25; cursor: pointer; }
  .row > label b { font-weight: normal; }
  .row > label .cc { display: block; }
  .row > label .swatch {
    display: inline-block; width: 10px; height: 10px; margin-left: 7px; border-radius: 2px;
    vertical-align: baseline;
  }
  .row.changed { border-left-color: var(--select); }
  .row.inert, .switch-row.inert { opacity: .38; }
  .row.unmarked > :not(label), .switch-row.unmarked > .picks { opacity: .3; }
  .row.unmarked > label, .switch-row.unmarked > label { color: var(--faint); cursor: pointer; }
  body.oneshot-mode .patch-only, body:not(.oneshot-mode) .oneshot-only { display: none; }
  body.oneshot-mode .grip, body.oneshot-mode #keepAs { display: none; }
  .firing-over { margin-top: 9px; }
  .pick-line { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .pick-line select { flex: 1 1 auto; min-width: 0; }
  .kit-head { margin-top: 18px; }
  .kit-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); }

  .track { position: relative; display: flex; align-items: center; height: 20px; }
  .track input[type=range] { width: 100%; margin: 0; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; background: transparent; height: 16px;
    --fill: #1f78f0; --rest: #e6e7ec;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 3px; background: var(--track, var(--rest));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px;
    border: 0; border-radius: 50%; background: var(--fill);
  }

  .track .ghost {
    position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--dim);
    opacity: .75; pointer-events: none; display: none; border-radius: 1px;
  }
  .row.changed .track .ghost { display: block; }

  .routes-button {
    width: 24px; height: 20px; padding: 0; font-size: 13px; line-height: 1;
    color: var(--faint); background: none; border: 1px solid var(--line);
  }
  .routes-button.aimed { color: var(--lfo); border-color: var(--lfo); }
  .routes-button.aimed.sounding { background: #4a2f38; }
  .routes-button.open { color: var(--bg); background: var(--lfo); border-color: var(--lfo); }

  .row > output, .showing { font-variant-numeric: tabular-nums; }
  .row > output { text-align: right; line-height: 1.25; white-space: nowrap; }
  .row > output .cc { display: block; }
  .row > output { display: grid; }
  .row > output > .now, .row > output > .room { grid-area: 1 / 1; }
  .row > output > .room { visibility: hidden; }

  .picks { display: flex; gap: 5px; flex-wrap: wrap; }
  .picks button { padding: 3px 8px; font-size: 11px; }
  .switch-row {
    display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 8px; align-items: center;
    padding-left: 7px; border-left: 2px solid transparent; margin-left: -9px;
  }
  .switch-row[hidden] { display: none; }
  .switch-row + .switch-row, .row + .switch-row, .switch-row + .row { margin-top: 6px; }
  .switch-row.locked .picks button { opacity: .5; cursor: default; }
  .switch-row.locked .picks button:hover { border-color: var(--line); color: var(--text); }
  .switch-row.locked .picks button.on { opacity: 1; border-color: var(--dim); color: var(--text); background: #3a3d48; }
  .switch-row > label { line-height: 1.25; }
  .switch-row > label b { font-weight: normal; }
  .switch-row > label .cc { display: block; }
  .switch-row .from { font-size: 10px; color: var(--faint); }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 13px; border-left: 3px solid var(--rail); }
  .card[data-tone=lfo] { border-left-color: var(--lfo); }
  .card[data-tone=scatter] { border-left-color: var(--scatter); }
  .card[data-tone=color] { border-left-color: var(--color); }
  .card-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 11px; }
  .card-name { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .card[data-tone=lfo] .card-name { color: var(--lfo); }
  .card[data-tone=scatter] .card-name { color: var(--scatter); }
  .card[data-tone=color] .card-name { color: var(--color); }
  .card-state { margin-right: auto; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .card.bypassed .card-body, .card.no-effect .card-body { opacity: .38; }
  .card-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 14px 22px; }
  .card-body.single { grid-template-columns: 1fr; }

  .route-panel {
    position: absolute; z-index: 30; background: var(--panel); border: 1px solid var(--lfo);
    border-radius: 6px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.55);
  }
  .route-block { padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid var(--line); }
  .route-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
  .route-name { color: var(--lfo); }
  .route-clock { margin-right: auto; margin-left: 10px; }
  .route-buttons { display: flex; gap: 5px; }
  .route-block.bypassed > :not(.route-head) { opacity: .38; }
  .route-wave { width: 100%; height: 46px; display: block; margin-top: 8px; }
  .route-foot { display: flex; justify-content: space-between; align-items: center; }
  .route-list { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 9px; }
  .route-list summary {
    cursor: pointer; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint);
  }
  .card.bypassed .route-list .route-line, .card.no-effect .route-list .route-line { opacity: .38; }
  .route-line {
    display: grid; grid-template-columns: auto minmax(0, 1fr) 150px auto; gap: 2px 14px;
    align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line);
  }
  .route-line:last-child { border-bottom: none; }
  .route-line[hidden] { display: none; }
  .route-line-target {
    grid-column: 2; background: none; border: none; padding: 0; text-align: left; color: var(--lfo);
  }
  .route-line > .grip { grid-column: 1; grid-row: 1 / span 2; margin-right: 0; }
  .route-line-values { grid-column: 2; }
  .route-line-wave { grid-column: 3; grid-row: 1 / span 2; height: 34px; margin-top: 0; }
  .route-line .route-buttons { grid-column: 4; grid-row: 1 / span 2; }
  .route-line.bypassed > :not(.route-buttons) { opacity: .38; }

  .outputs { border-left: 3px solid var(--out); }
  .output-grid .subhead:not(:first-child) { margin-top: 14px; }
  .output-grid > :first-child { grid-column: 1 / -1; }
  .output-grid > :first-child > div { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 0 22px; align-items: center; }
  .output-grid > :first-child > div > * + * { margin-top: 0; }
  .output-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px 22px; }

  .dock canvas { width: 100%; border-radius: 4px; display: block; background: #0a0b0e; }
  .dockgrid { display: grid; grid-template-columns: 1fr; gap: 0; }
  .showing-row { display: flex; gap: 10px; align-items: center; margin-bottom: 9px; }
  .showing-row h2 { margin: 0 auto 0 0; }
  .showing-row .showing { margin-top: 0; }
  .showing { text-align: center; color: var(--select); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; }
  .dock .rowline { margin-top: 9px; }
  .dock input[type=text] { width: 84px; }
  .dock input.invalid { border-color: var(--bad); }

  @media (max-width: 1120px) {
    .shell { grid-template-columns: minmax(220px, 252px) minmax(0, 1fr); }
    .dock { grid-column: 1 / -1; order: -1; position: static; }
    .dockgrid { grid-template-columns: 172px minmax(0, 1fr); gap: 16px; align-items: start; }
  }
  @media (max-width: 780px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; }
  }
</style>
</head>
<body>

<header class="top" id="topbar">
  <h1>Aurora &mdash; patch editor</h1>
  <div class="group">
    <select id="port"><option>no MIDI</option></select>
    <span id="midiState" class="bad">not connected</span>
  </div>
  <div class="group">
    <button id="clockToggle">clock</button>
    <input type="number" id="bpm" value="120" min="40" max="220" step="1" style="width:66px">
    <span class="cc">BPM</span>
    <span class="beats" id="beats"><i></i><i></i><i></i><i></i></span>
  </div>
  <div class="group">
    <button id="libraryView">library</button>
  </div>
  <div class="group">
    <button id="sendPatch">send to the wall</button>
  </div>
  <p id="status"></p>
  <div class="group">
    <button id="midiToggle" class="tiny">MIDI</button>
    <button id="rigBlackout" class="tiny">blackout</button>
  </div>
</header>

<div class="shell">

  <aside class="rail">
    <section class="panel">
      <h2><span id="subjectKind">Patch</span>
        <button class="tiny" id="patchNew">new</button>
        <button class="tiny" id="patchSave">save</button>
        <button class="tiny" id="patchDiscard">discard</button>
      </h2>
      <div class="fields">
        <label class="field"><span>Name</span><input type="text" id="patchName"></label>
        <label class="field patch-only"><span>Tempo division <span class="cc midi-number" id="tempoDivisionCC"></span></span><select id="tempoDivision"></select></label>
        <label class="field patch-only"><span>Transition time</span><select id="transitionTime"></select></label>
        <label class="field patch-only"><span>Accent time</span><select id="accentTime"></select></label>
        <div class="field patch-only"><span>Oneshot 1 <span class="cc midi-number" id="oneshotPick0Note"></span></span><div class="pick-line"><select id="oneshotPick0"></select><button class="tiny" id="oneshotFire0">fire</button></div></div>
        <div class="field patch-only"><span>Oneshot 2 <span class="cc midi-number" id="oneshotPick1Note"></span></span><div class="pick-line"><select id="oneshotPick1"></select><button class="tiny" id="oneshotFire1">fire</button></div></div>
        <label class="field oneshot-only"><span>Length</span><select id="oneshotLength"></select></label>
      </div>
      <nav class="layers patch-only" id="layerTabs"></nav>
    </section>
    <section class="panel oneshot-only" id="firingBar">
      <div class="rowline">
        <button class="tiny" id="oneshotFire">fire</button>
        <button class="tiny" id="oneshotRepeat">repeat</button>
        <output class="cc" id="firingAt"></output>
      </div>
      <div class="fields firing-over">
        <div class="field"><span>Over</span><div class="pick-line"><select id="overPatch"></select><button class="tiny" id="editOver">edit</button></div></div>
      </div>
    </section>
    <section class="panel transition" id="transitionBar"></section>
    <section class="panel" id="mixBar" hidden></section>
  </aside>

  <main class="work">

    <section class="panel library" id="libraryPanel" hidden>
      <div class="library-head">
        <h2>Library</h2>
        <span class="cc" id="libraryCount"></span>
        <div class="rowline">
          <button class="tiny" id="saveHere">save to slot</button>
          <button class="tiny" id="patchDelete">delete</button>
        </div>
      </div>
      <div class="library-head">
        <div class="rowline">
          <span class="cc">brain</span>
          <button class="tiny" id="brainAsk">ask</button>
          <button class="tiny" id="brainPush">push the library</button>
          <button class="tiny" id="brainPull">pull it back</button>
        </div>
        <div class="rowline">
          <span class="cc">file</span>
          <button class="tiny" id="fileSave">save a file</button>
          <button class="tiny" id="fileLoad">load a file</button>
          <input type="file" id="filePick" accept=".json,application/json" hidden>
        </div>
      </div>
      <div class="patch-grid" id="patchGrid"></div>
      <div class="library-head kit-head">
        <h2>Oneshots</h2>
        <span class="cc" id="kitCount"></span>
        <div class="rowline">
          <button class="tiny" id="oneshotDelete">delete</button>
        </div>
        <div class="rowline">
          <span class="cc">default</span>
          <select class="tiny" id="defaultOneshot0"></select>
          <select class="tiny" id="defaultOneshot1"></select>
        </div>
      </div>
      <div class="patch-grid kit-grid" id="kitGrid"></div>
    </section>

    <div class="view" id="editorView">

      <section class="panel outputs">
        <h2>Outputs</h2>
        <div class="output-grid" id="outputs"></div>
      </section>

      <div class="cards" id="lfo"></div>

      <section class="panel shape" id="shape"></section>

      <div class="cards" id="engines"></div>

    </div>

  </main>

  <aside class="dock">
    <section class="panel">
      <div class="showing-row">
        <h2>The wall</h2>
        <p class="showing" id="wallShowing"></p>
        <select id="keepAs" class="tiny"></select>
      </div>
      <div class="dockgrid">
        <canvas id="wallMain"></canvas>
        <div>
          <div class="overlay-buttons" id="wallOverlays">
            <div>
              <button class="tiny" data-overlay="palette" data-tone="out">palette</button>
              <button class="tiny" data-overlay="arp" data-tone="lfo">arp</button>
            </div>
            <div>
              <button class="tiny" data-overlay="centers" data-tone="shape">centers</button>
              <button class="tiny" data-overlay="bend" data-tone="travel">bend</button>
              <button class="tiny" data-overlay="fan" data-tone="fan">fan</button>
            </div>
            <div>
              <button class="tiny" data-overlay="spots" data-tone="scatter">spots</button>
              <button class="tiny" data-overlay="field" data-tone="color">field</button>
            </div>
          </div>
          <div class="rowline">
            <label class="cc">strips <input type="text" id="stripOrder"></label>
            <label class="cc">PARs <input type="text" id="parOrder"></label>
          </div>
        </div>
      </div>
    </section>
  </aside>
