; Aurora controller firmware
;
; Scans local controls (keypad, faders, touchpad, switches, tap tempo,
; mic trigger), parses incoming MIDI (DAW clock + foot-controller PC),
; and emits a unified MIDI stream on DIN out to the brain.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = nano

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_flags =
    -I../shared
lib_deps =
    fortyseveneffects/MIDI Library
    adafruit/Adafruit TouchScreen @ ^1.1.6
