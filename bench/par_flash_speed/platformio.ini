; Aurora PAR flash-speed bench — standalone, not part of the brain firmware.
;
; Measures the shortest dimmer flash a BeamZ BCC145 still renders as a
; flash, and whether it lags or smooths. See TODO.md "Measure how fast a
; PAR can be played" for the test and what each outcome means.
;
; Build:   pio run
; Upload:  pio run -t upload

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps =
    ssilverman/TeensyDMX
    fastled/FastLED
