; Aurora DMX bench bring-up — standalone, not part of the brain firmware.
;
; Proves the M5Stack DMX Unit (U183) path end to end before any of the
; Teensy brain port exists. See docs/wiring.md "DMX OUT".
;
; Build:   pio run
; Upload:  pio run -t upload

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps =
    ssilverman/TeensyDMX
