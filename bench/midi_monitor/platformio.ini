; Aurora MIDI bench monitor — standalone, not part of the brain firmware.
;
; Prints every MIDI message arriving over USB and turns MIDI clock into
; the tempo pulse the brain firmware will run on. Proves the laptop →
; Teensy MIDI path before any of the brain port exists.
;
; USB_MIDI_SERIAL gives the Teensy a MIDI port *and* a serial console on
; the one cable; plain USB_MIDI would leave nowhere to print.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -D USB_MIDI_SERIAL
    -I../../shared
