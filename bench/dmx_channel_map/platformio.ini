; Aurora DMX channel mapping — standalone bench tool.
;
; Lights one DMX channel at a time so a fixture's channel layout can be
; read off by eye. Results belong in docs/wiring.md "DMX OUT".
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps =
    ssilverman/TeensyDMX
