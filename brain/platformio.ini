; Aurora brain firmware
;
; Two environments:
;   nano     — current Nano ATmega328 target (the code as it sits today).
;              Used for parity testing and for flashing the existing
;              hardware until the Teensy port lands.
;   teensy40 — future target. Will not compile cleanly until the Teensy
;              port is done (PORTB keypad tricks, FastLED -> OctoWS2811,
;              MIDI input, etc.).
;
; Build:   pio run -e nano         (or -e teensy40)
; Upload:  pio run -e nano -t upload
; Monitor: pio device monitor

[platformio]
default_envs = nano

[env]
framework = arduino
build_flags =
    -I../shared

[env:nano]
platform = atmelavr
board = nanoatmega328
lib_deps =
    fastled/FastLED @ ^3.10.3
    adafruit/Adafruit TouchScreen @ ^1.1.6

[env:teensy40]
platform = teensy
board = teensy40
lib_deps =
    fastled/FastLED @ ^3.10.3
    paulstoffregen/OctoWS2811
    fortyseveneffects/MIDI Library
