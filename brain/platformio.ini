; Aurora brain firmware — Teensy 4.0.
;
; The brain is always a Teensy. The ATmega328 firmware for the old
; single-box Aurora lives at the `aurora-nano-final` tag:
;   git checkout aurora-nano-final && cd brain && pio run -e nano -t upload
;
; AURORA_DEBUG prints one line per tempo pulse to the serial console. It
; is on while the strips are still off the bench and there is nothing to
; look at; drop it once the LEDs are trusted.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
build_flags =
    -I../shared
    -D USB_MIDI_SERIAL
    -D AURORA_DEBUG
lib_deps =
    fastled/FastLED @ ^3.10.3
